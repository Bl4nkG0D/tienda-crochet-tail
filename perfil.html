<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil - Favoritos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #E292E5;
        }

        .favorite-btn {
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: red;
        }
    </style>
</head>

<body class="min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2 text-xl font-bold">
                <img src="gghdbh.jpg" alt="Logo" class="h-10">
                <span>Crochetlandia</span>
            </a>
            <ul class="hidden md:flex space-x-6 items-center">
                <li class="relative group">
                    <button class="hover:underline">Productos</button>
                    <ul class="absolute hidden group-hover:block bg-white shadow-md rounded mt-2 w-48 text-left z-10">
                        <li><a href="animales.html" class="block px-4 py-2 hover:bg-gray-100">Animales</a></li>
                        <li><a href="halloween.html" class="block px-4 py-2 hover:bg-gray-100">Halloween</a></li>
                        <li><a href="navidad.html" class="block px-4 py-2 hover:bg-gray-100">Navidad</a></li>
                        <li>
                            <hr class="my-1">
                        </li>
                        <li><a href="todasCat.html" class="block px-4 py-2 hover:bg-gray-100">Ver todas las
                                categorías</a></li>
                    </ul>
                </li>
                <li><a href="perfil.html" class="hover:underline">Perfil</a></li>
                <li><a href="#" class="hover:underline">Contacto</a></li>
                <li class="relative">
                    <a href="carrito.html" class="hover:underline">
                        🛒 Carrito
                        <span id="cart-count"
                            class="absolute -top-2 -right-4 bg-red-600 text-white rounded-full text-xs px-2 py-0.5">0</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Contenido -->
    <div class="container mx-auto my-8 px-4">
        <h2 class="text-3xl font-bold text-center mb-6">Favoritos</h2>
        <div id="favoritosContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Script de favoritos -->
    <script>
        const favoritosContainer = document.getElementById("favoritosContainer");
        let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

        function renderFavoritos() {
            favoritosContainer.innerHTML = "";
            if (favoritos.length === 0) {
                favoritosContainer.innerHTML = "<p>No tienes productos en favoritos.</p>";
                return;
            }

            favoritos.forEach((producto, index) => {
                const card = document.createElement("div");
                card.className = "col";
                card.innerHTML = `
                <div class="relative bg-white border border-black rounded-lg shadow h-full">
                    <button class="absolute top-2 right-2 text-red-600 text-xl" data-id="${producto.id}" onclick="eliminarFavorito(this)">
                        &hearts;
                    </button>
                    <img src="${producto.imagen}" alt="${producto.titulo}" class="w-full h-52 object-cover rounded-t-lg cursor-pointer" onclick="verProducto(${index})">
                    <div class="p-4">
                        <h5 class="text-lg font-semibold">${producto.titulo}</h5>
                        <p class="text-gray-700">$${producto.precio} MXN</p>
                    </div>
                </div>
                `;
                favoritosContainer.appendChild(card);
            });
        }

        function eliminarFavorito(id) {
            favoritos = favoritos.filter(p => p.id !== id);
            localStorage.setItem("favoritos", JSON.stringify(favoritos));
            renderFavoritos();
        }

        function verProducto(index) {
            localStorage.setItem("producto", JSON.stringify(favoritos[index]));
            window.location.href = "producto.html";
        }

        function eliminarFavorito(btn) {
    const id = parseInt(btn.getAttribute('data-id'));

    favoritos = favoritos.filter(p => p.id !== id);

    localStorage.setItem("favoritos", JSON.stringify(favoritos));

    btn.classList.remove('text-red-600');

    renderFavoritos();
}



        renderFavoritos();

        const carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        const cartCount = document.getElementById('cart-count');
        if (cartCount) {
            cartCount.textContent = carrito.length;
        }
    </script>

</body>

</html>
